model:
  rgb_channels: 3      # 3 para RGB, ajustar si el ortomosaico es multiespectral
  chm_channels: 1       # CHM / nDSM
  base_channels: 32
  bilinear: true

data:
  train_dir: data/processed/train
  val_dir: data/processed/val
  rgb_scale: 65535.0    # sensor de 16 bits (no 8 bits); divisor para normalizar a [0,1]
  chm_max: 10.0          # el "chm" aca es relieve local (altura sobre el terreno circundante,
                          # no elevacion absoluta): max observado ~8.9m en parcela3 28-1-26

loss:
  mask_weight: 1.0
  dist_weight: 1.0
  dice_weight: 1.0

training:
  epochs: 50
  batch_size: 8
  lr: 0.001
  num_workers: 4
  checkpoint_dir: checkpoints

tiling:
  tile_size: 256
  overlap: 32
  min_valid_fraction: 0.1

inference:
  tile_size: 256
  overlap: 64
  mask_threshold: 0.5
  min_seed_distance: 4
  min_instance_area: 5
