model:
  type: rgb_only       # un solo encoder, sin rama de altura (para despliegue/inferencia real)
  rgb_channels: 3
  base_channels: 32
  bilinear: true

data:
  train_dir: data/processed/train
  val_dir: data/processed/val
  rgb_scale: 65535.0    # sensor de 16 bits (no 8 bits); divisor para normalizar a [0,1]
  chm_max: 10.0          # no se usa con model.type=rgb_only, se deja por compatibilidad del loader

loss:
  mask_weight: 1.0
  dist_weight: 1.0
  dice_weight: 1.0

training:
  epochs: 50
  batch_size: 8
  lr: 0.001
  num_workers: 4
  checkpoint_dir: checkpoints_rgb_only

tiling:
  tile_size: 256
  overlap: 32
  min_valid_fraction: 0.1

inference:
  tile_size: 256
  overlap: 64
  mask_threshold: 0.5
  min_seed_distance: 4
  min_instance_area: 5
