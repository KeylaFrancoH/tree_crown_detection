model:
  rgb_channels: 7       # bandas 1-7 del ortomosaico CEDIA (RGB + 4 multiespectrales; banda 8 es alfa, se descarta)
  chm_channels: 1        # CHM aproximado (DSM - terreno estimado), ver src/data/height.py
  base_channels: 32
  bilinear: true

data:
  train_dir: cedia_dataset/train
  val_dir: cedia_dataset/val
  test_dir: cedia_dataset/test   # usado solo por scripts/evaluate.py, no por el entrenamiento
  rgb_scale: 65535.0     # bandas originales uint16
  chm_max: 25.0            # cubre holgadamente el p99 (~16 m) y el máximo observado (~23 m) en las etiquetas

loss:
  mask_weight: 1.0
  dist_weight: 1.0
  dice_weight: 1.0

training:
  epochs: 300            # el doble que configs/cedia.yaml (150), para ver si sigue bajando el loss
  batch_size: 16
  lr: 0.0005
  num_workers: 4
  checkpoint_dir: checkpoints_cedia_long   # carpeta separada, no pisa checkpoints_cedia/best.pth

tiling:
  tile_size: 256
  overlap: 32
  min_valid_fraction: 0.5

inference:
  tile_size: 256
  overlap: 64
  mask_threshold: 0.5
  min_seed_distance: 24
  min_instance_area: 100
